<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Dollar Catch Robot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="Dollar Catch Robot game">
      <header class="topbar">
        <div>
          <p class="eyebrow">CAMERA ARCADE</p>
          <h1>Dollar Catch <span>Robot</span></h1>
        </div>
        <div class="status" id="status" data-state="idle">Camera ready</div>
      </header>

      <div class="stage-wrap">
        <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>
        <video id="camera" autoplay playsinline muted></video>
        <div class="stage-message" id="stage-message">
          <div class="signal-icon">+</div>
          <p id="message-text">Start the camera to play</p>
          <button id="start-button" type="button">Start game</button>
        </div>
      </div>

      <footer class="controls">
        <span><b>Hand</b> move the robot</span>
        <span><b>Mouse / touch</b> also works</span>
        <span><b>Q</b> pause camera</span>
        <button id="restart-button" type="button" title="Restart the game">Restart</button>
      </footer>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
